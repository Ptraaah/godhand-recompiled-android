name: build

# Compile lane: the parts of the app that are open source build here, on
# GitHub's runners, instead of on a small local box. The game core
# (libgodhand.so) is NOT built here and never will be: it links generated
# code produced from the owner's own disc, and no game data or generated
# game code ever enters this repo. Packaging and signing also stay local.
# What this lane produces: libpcsx2gs.so + libshaderc_shared.so, and an
# unsigned APK shell (manifest + dex + resources + those two libraries).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "path-b/**"
      - "android/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    name: bridge (libpcsx2gs + libshaderc)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Pin ccache's home so the setup step, the cache action and the
      # build all agree on where the cache lives (ccache 4's own default
      # is ~/.cache/ccache; nothing in this job may guess at it).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # ccache is only a build-speed accelerator, so nothing about it
      # may ever fail the build. Installing it goes through apt, and a
      # runner DNS failure ("Temporary failure resolving
      # 'security.ubuntu.com'", apt exit 100) once killed this job
      # before any compile ran — twice in a row. So: retry the install,
      # keep the step non-fatal, and let the build below use the ccache
      # launcher only when the binary is actually there.
      - name: Set up ccache
        id: ccache
        continue-on-error: true
        run: |
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq ccache; then
              installed=1
              break
            fi
            echo "apt attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          if [ "$installed" = 1 ] && command -v ccache >/dev/null 2>&1; then
            ccache --set-config=max_size=1G
            ccache --zero-stats
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ccache could not be installed; building without it (slower, same result)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # The cache lives in $CCACHE_DIR (job env above). The path this
      # step used to save, ~/.ccache, is ccache 3's home; ccache 4
      # never wrote there, the save always warned "path does not
      # exist", and the cache never actually persisted between runs.
      - name: Cache ccache
        if: steps.ccache.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-bridge-${{ hashFiles('path-b/**') }}
          restore-keys: |
            ccache-bridge-

      - name: Build libshaderc_shared.so from the NDK's shaderc
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: sh path-b/build-shaderc.sh

      - name: Build libpcsx2gs.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          LAUNCHER_ARGS=()
          if command -v ccache >/dev/null 2>&1; then
            LAUNCHER_ARGS=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          else
            echo "ccache unavailable: configuring without a compiler launcher"
          fi
          cmake -S path-b -B path-b/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            "${LAUNCHER_ARGS[@]}"
          cmake --build path-b/build --target pcsx2gs -j "$(nproc)"
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Collect native libraries
        run: |
          mkdir -p out
          cp path-b/build/libpcsx2gs.so out/
          cp path-b/shaderc-out/libshaderc_shared.so out/
          ls -la out/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: out/*.so
          if-no-files-found: error

  shell:
    name: shell (unsigned apk)
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action: its default package list includes the
      # legacy "tools" package, which sdkmanager can no longer find, and
      # the step fails after doing its real work. The runner image ships
      # an SDK already; just add the two pinned pieces we need.
      - name: Install platform android-36 and build-tools 36.0.0
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(echo "$SDK"/cmdline-tools/*/bin/sdkmanager | tr ' ' '\n' | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"

      - name: Get the bridge libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: libs

      - name: Build the unsigned shell APK
        env:
          GODHAND_LIBS_DIR: ${{ github.workspace }}/libs
        run: sh android/shell/build-apk.sh

      - name: Upload the unsigned shell APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-shell-unsigned
          path: android/shell/build/godhand-shell-unsigned.apk
          if-no-files-found: error
